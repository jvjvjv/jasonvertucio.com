; php-fpm.d/*.conf loads alphabetically, and the base image's own
; zz-docker.conf (loaded after our www.conf) unconditionally resets
; `listen = 9000` for the [www] pool. This file's name sorts after zz-docker
; so it wins, re-pointing php-fpm at the unix socket nginx's fastcgi_pass
; (docker/nginx/default.conf) expects.
[www]
listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0666
