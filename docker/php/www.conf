[www]
user = www-data
group = www-data

; nginx's fastcgi_pass (docker/nginx/default.conf) points at this socket
; rather than the base image's default 127.0.0.1:9000.
listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0666

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
