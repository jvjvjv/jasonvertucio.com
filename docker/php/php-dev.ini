; Development PHP settings
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

memory_limit = 256M
max_execution_time = 120
max_input_time = 120
post_max_size = 64M
upload_max_filesize = 64M

; Disable opcache in dev so code changes are reflected immediately
opcache.enable = 0
opcache.enable_cli = 0
