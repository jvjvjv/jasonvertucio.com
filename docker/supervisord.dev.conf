[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vite]
; Disabled: this container is reachable over the network (jasonvertucio.local),
; not just from the Docker host. The Vite dev server writes public/hot
; pointing at http://localhost:5173, which @vite() then prefers over
; public/build/manifest.json unconditionally — that URL only resolves for
; whoever is browsing from the Docker host itself, so it 404s for every other
; device on the network. Run `npm run build` (see docker/entrypoint.sh, which
; also removes any stale public/hot) instead, and rebuild after JS/CSS changes.
; To get live-reload back for host-only work, set autostart=true here and
; `rm public/hot` won't be needed.
command=npm run dev -- --host 0.0.0.0
directory=/var/www/app
autostart=false
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=php /var/www/app/artisan queue:listen --tries=1 --timeout=90
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
